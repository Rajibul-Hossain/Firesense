<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ESP32 Simulator - Zone 5C</title>
    <style>
        body { 
            background-color: #0b0d10; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: sans-serif;
            margin: 0;
        }
        button {
            background-color: #ff9900; /* Orange for Chemical Fire */
            color: white;
            border: none;
            padding: 25px 50px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 153, 0, 0.5);
            transition: all 0.2s;
        }
        button:active { transform: scale(0.95); }
        button.success {
            background-color: #ff3b30;
            box-shadow: 0 0 30px rgba(255, 59, 48, 0.8);
        }
    </style>
</head>
<body>

    <button id="fireButton">🧪 TRIGGER ZONE 5C (CHEMICAL)</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAAl85IvWatbWiLl7MkCNydknJsttGGktk",
            authDomain: "fire-apsk.firebaseapp.com",
            databaseURL: "https://fire-apsk-default-rtdb.firebaseio.com",
            projectId: "fire-apsk",
            storageBucket: "fire-apsk.firebasestorage.app",
            messagingSenderId: "694099610438",
            appId: "1:694099610438:web:92d00fce314b8b0e49b347",
            measurementId: "G-27X628E1ZL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // The raw telemetry payload (App handles the rest!)
        const rawSensorData = {
            temperature: 16.0,
            smoke: 5
        };

        const btn = document.getElementById('fireButton');

        btn.addEventListener('click', async () => {
            btn.innerText = "SENDING...";
            try {
                // Notice it now points to sensors/zone_5c
                await set(ref(db, 'sensors/zone_8d'), rawSensorData);
                
                btn.innerText = "🔥 ZONE 5C CRITICAL! CHECK APP";
                btn.classList.add('success');
                
                setTimeout(() => {
                    btn.innerText = "🧪 TRIGGER ZONE 5C (CHEMICAL)";
                    btn.classList.remove('success');
                }, 3000);

            } catch (error) {
                console.error("Error writing to database: ", error);
                alert("Failed to send: " + error.message);
                btn.innerText = "ERROR - CHECK CONSOLE";
            }
        });
    </script>
</body>
</html>
