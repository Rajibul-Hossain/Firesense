<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APSK Command | Secure Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="bg-shape circle-1"></div>
    <div class="bg-shape circle-2"></div>
    <div class="bg-shape circle-3"></div>
    <div class="bg-shape blob-1"></div>

    <div class="glass-panel" id="glass-panel">
        
<div class="branding">
    <div class="logo-circle">
        <img src="Main/maps/assets/image copy.png" class="shield-icon">
    </div>

            <h2>ARMY PUBLIC SCHOOL KOLKATA</h2>
            <p class="subtitle">Fire Safety Manager</p>
        </div>

        <div class="login-container">
            <form id="login-form">
                <div class="input-group">
                    <div class="icon">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                    </div>
                    <input type="email" id="email-input" placeholder="ADMIN EMAIL" required autocomplete="email">
                </div>

                <div class="input-group">
                    <div class="icon">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                        </svg>
                    </div>
                    <input type="password" id="password-input" placeholder="PASSWORD" required>
                </div>

                <p class="error-msg" id="error-msg">Authentication failed.</p>

                <button type="submit" class="submit-btn" id="submit-btn">AUTHENTICATE SYSTEM</button>
            </form>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
